# Adapted from IF; manual and disabled pending explicit preview authorization.
name: preview
on: workflow_dispatch
permissions: { contents: read, deployments: write }
concurrency: { group: 'preview-${{ github.ref_name }}', cancel-in-progress: true }
jobs:
  preview:
    if: vars.GUARDIAN_RING_PREVIEW == 'enabled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx tsx tools/claims.mjs
      - run: npm run build
      - run: npx wrangler@4 pages deploy dist --project-name=guardian-ring --branch="${{ github.ref_name }}" --commit-hash="${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
